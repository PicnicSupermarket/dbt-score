name: ci

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      # NOTE: This matrix duplicates the Python/dbt-core combinations defined in
      # tox.ini's `env_list`. If you add or drop a Python or dbt version, update
      # BOTH files. Each dbt version is tested against the oldest and newest
      # Python it supports, following dbt's Python compatibility matrix:
      # https://docs.getdbt.com/faqs/Core/install-python-compatibility
      #   dbt 1.5/1.6:   Python 3.11
      #   dbt 1.7/1.10:  Python 3.11-3.12
      #   dbt 1.11:      Python 3.11-3.13
      #   dbt 1.12:      Python 3.11-3.14
      matrix:
        include:
          - { python: "3.11", dbt-core: "15" }
          - { python: "3.11", dbt-core: "16" }
          - { python: "3.11", dbt-core: "17" }
          - { python: "3.12", dbt-core: "17" }
          - { python: "3.11", dbt-core: "110" }
          - { python: "3.12", dbt-core: "110" }
          - { python: "3.11", dbt-core: "111" }
          - { python: "3.13", dbt-core: "111" }
          - { python: "3.11", dbt-core: "112" }
          - { python: "3.14", dbt-core: "112" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository:
            ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          uv sync --locked --only-dev
      - name: Run Tox
        run: |
          PYTHON_VERSION=$(echo "${{ matrix.python }}" | sed 's/\.//')
          uv run tox -e py${PYTHON_VERSION}-dbt${{ matrix.dbt-core }}

  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          uv sync --locked --only-dev
      - name: Run Prettier
        run: npx --yes prettier@3.1.0 --check "**/*.{json,yaml,yml,md}"
      - name: Run Tox lint
        run: |
          uv run tox -e lint
